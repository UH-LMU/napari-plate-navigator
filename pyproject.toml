[project]
name = "napari-plate-navigator"
dynamic = ["version"]
description = "A Napari plugin for browsing well plate data."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Harri Jäälinoja"},
  {email = "harri.jaalinoja@helsinki.fi"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
# napari can be included in dependencies if napari imports are required.
# However, you should not include napari[all], napari[qt],
# or any other Qt bindings directly (e.g. PyQt5, PySide2).
# See best practices: https://napari.org/stable/plugins/building_a_plugin/best_practices.html
dependencies = [
    "numpy",
    "magicgui",
    "qtpy", "bioio-tifffile>=1.3.0,<2",
]

[project.optional-dependencies]
# Allow easily installation with the full, default napari installation
# (including Qt backend) using napari-plate-navigator[all].
all = ["napari[all]"]

[dependency-groups]
testing = [
    "tox",
    "pytest",  # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari[qt]",  # test with napari's default Qt bindings
]
analysis = ["cztile"]

[project.entry-points."napari.manifest"]
napari-plate-navigator = "napari_plate_navigator:napari.yaml"

[project.urls]
"Bug Tracker" = "https://github.com/UH-LMU/napari-plate-navigator/issues"
"Documentation" = "https://github.com/UH-LMU/napari-plate-navigator#README.md"
"Source Code" = "https://github.com/UH-LMU/napari-plate-navigator"
"User Support" = "https://github.com/UH-LMU/napari-plate-navigator/issues"

[build-system]
requires = ["setuptools>=42.0.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/napari_plate_navigator/_version.py"
fallback_version = "0.0.1+nogit"

[tool.black]
line-length = 79
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.ruff]
line-length = 79
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]
fix = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
bioio = ">=3.0.0,<4"
czifile = ">=2019.7.2.1,<2020"
dask = ">=2025.10.0,<2026"
jupyterlab = ">=4.4.9,<5"
matplotlib = ">=3.10.7,<4"
numpy = ">=2.3.3,<3"
pandas = ">=2.3.3,<3"
pydash = ">=8.0.5,<9"
scipy = ">=1.16.2,<2"
scikit-image = ">=0.25.2,<0.26"
xmltodict = ">=1.0.2,<2"
zarr = ">=3.1.3,<4"
napari = ">=0.6.6,<0.7"

[tool.pixi.pypi-dependencies]
czitools = ">=0.11.1,<0.12"
bioio-czi = ">=2.4.0,<3"
napari-plate-navigator = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
all = { features = ["all"], solve-group = "default" }
testing = { features = ["testing"], solve-group = "default" }
analysis = { features = ["analysis"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.feature.analysis.dependencies]
scikit-image = ">=0.25.2,<0.26"
matplotlib = ">=3.10.7,<4"
