name: napari-plate-navigator
display_name: Plate Navigator
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: napari-plate-navigator.get_reader
      python_name: napari_plate_navigator._reader:napari_get_reader
      title: Open data with Plate Navigator
    - id: napari-plate-navigator.write_multiple
      python_name: napari_plate_navigator._writer:write_multiple
      title: Save multi-layer data with Plate Navigator
    - id: napari-plate-navigator.write_single_image
      python_name: napari_plate_navigator._writer:write_single_image
      title: Save image data with Plate Navigator
    - id: napari-plate-navigator.make_sample_data
      python_name: napari_plate_navigator._sample_data:make_sample_data
      title: Load sample data from Plate Navigator
    - id: napari-plate-navigator.make_container_widget
      python_name: napari_plate_navigator:ImageThreshold
      title: Make threshold Container widget
    - id: napari-plate-navigator.make_magic_widget
      python_name: napari_plate_navigator:threshold_magic_widget
      title: Make threshold magic widget
    - id: napari-plate-navigator.make_function_widget
      python_name: napari_plate_navigator:threshold_autogenerate_widget
      title: Make threshold function widget
    - id: napari-plate-navigator.make_qwidget
      python_name: napari_plate_navigator:ExampleQWidget
      title: Make example QWidget
  readers:
    - command: napari-plate-navigator.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: napari-plate-navigator.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari-plate-navigator.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  sample_data:
    - command: napari-plate-navigator.make_sample_data
      display_name: Plate Navigator
      key: unique_id.1
  widgets:
    - command: napari-plate-navigator.make_container_widget
      display_name: Container Threshold
    - command: napari-plate-navigator.make_magic_widget
      display_name: Magic Threshold
    - command: napari-plate-navigator.make_function_widget
      autogenerate: true
      display_name: Autogenerate Threshold
    - command: napari-plate-navigator.make_qwidget
      display_name: Example QWidget
